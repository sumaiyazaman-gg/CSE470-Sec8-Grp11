<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Campus Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">S</div>
      <h1>Campus Portal</h1>
      <p>University of Bangladesh</p>
    </div>

    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="login-tab" onclick="switchTab('register')">Register</button>
    </div>

    <div id="alert" class="alert"></div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="form-group">
        <label>University Email</label>
        <input type="email" id="login-email" placeholder="@g.bracu.ac.bd">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Enter your password" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;" onclick="doLogin()" id="login-btn">
        Sign In
      </button>
      <p style="font-size:13px;color:var(--text-muted);margin-top:14px;text-align:center;">
        Admin: Welcome to Campus Portal!
      </p>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>University Email</label>
        <input type="email" id="reg-email" placeholder="you@g.bracu.ac.bd">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Min. 6 characters" onkeydown="if(event.key==='Enter') doRegister()">
      </div>
        <div class="form-group">
        <label>Role</label>
         <select id="reg-role">
         <option value="student">Student</option>
         <option value="alumni">Alumni</option>
         <option value="faculty">Faculty</option>
      <!--<option value="admin">Admin</option>-->
      </select>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;" onclick="doRegister()" id="reg-btn">
        Create Account
      </button>
    </div>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('token')) {
    const role = localStorage.getItem('role');
    window.location = role === 'admin' ? 'admin.html' : 'dashboard.html';
  }

  function switchTab(tab) {
    document.querySelectorAll('.login-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('login-form').style.display   = tab === 'login'    ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    hideAlert();
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = msg;
    el.className = `alert alert-${type} show`;
  }
  function hideAlert() {
    document.getElementById('alert').classList.remove('show');
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;
    if (!email || !password) return showAlert('Please enter email and password.');

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
     const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error || 'Login failed.');

      localStorage.setItem('token', data.token);
      localStorage.setItem('uid', data.user.id);
      localStorage.setItem('name', data.user.name);
      localStorage.setItem('role', data.user.role);
      localStorage.setItem('email', data.user.email);

      window.location = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
    } catch {
      showAlert('Cannot connect to server. Make sure the server is running.');
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  async function doRegister() {
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-pass').value;
    const role = document.getElementById('reg-role').value;
    if (!name || !email || !password) return showAlert('All fields are required.');

    const btn = document.getElementById('reg-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';

    try {
      const res = await fetch('http://localhost:3000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({ name, email, password, role })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error || 'Registration failed.');

      localStorage.setItem('token', data.token);
      localStorage.setItem('uid', data.user.id);
      localStorage.setItem('name', data.user.name);  
      localStorage.setItem('role', data.user.role);
      localStorage.setItem('email', data.user.email);
      window.location = 'dashboard.html';
    } catch {
      showAlert('Cannot connect to server.');
    } finally {
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
